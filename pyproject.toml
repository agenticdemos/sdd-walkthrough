[project]
name = "sdd-walkthrough"
version = "0.1.0"
description = "Spec-driven development end to end: a small walkthrough repo. All figures illustrative."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "schemathesis>=4.0",
    "openapi-core>=0.19",
    "mutmut>=3.3",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger", "src/report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
