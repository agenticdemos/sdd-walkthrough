# mutmut 3.x reads [tool.mutmut] from pyproject.toml if present, otherwise this section.
# Mutate only the evidentiary area (src/ledger/rules/); copy the rest of src/ so imports work.
[mutmut]
source_paths=src/
only_mutate=src/ledger/rules/*
pytest_add_cli_args_test_selection=tests/unit/
also_copy=
    tools/
